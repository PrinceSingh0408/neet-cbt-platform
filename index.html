<!DOCTYPE html>
<html>
<head>
  <title>NEET CBT Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .option {
      padding: 12px;
      margin: 8px 0;
      border: 2px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
    }
    .option.selected {
      border-color: #2563eb;
      background-color: #dbeafe;
    }
  </style>
</head>
<body>
  <h2 id="question">Loading...</h2>
  <div id="options"></div>

  <script>
    const SUPABASE_URL = "https://tqjjnogifmhcslbxwnrs.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Eluq0Y73vVI9cFz6yRxzrA_df1IZNNs";

    let selectedOption = null;

    fetch(`${SUPABASE_URL}/rest/v1/questions?select=*&limit=1`, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    })
      .then(res => res.json())
      .then(data => {
        const q = data[0];
        document.getElementById("question").innerText = q.question_text;

        const options = { A: q.option_a, B: q.option_b, C: q.option_c, D: q.option_d };
        const container = document.getElementById("options");

        Object.entries(options).forEach(([key, text]) => {
          const div = document.createElement("div");
          div.className = "option";
          div.innerText = `${key}. ${text}`;
          div.onclick = () => selectOption(key, div);
          container.appendChild(div);
        });
      })
      .catch(err => {
        document.getElementById("question").innerText = "Error loading question.";
        console.error(err);
      });

    function selectOption(key, element) {
      document.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
      element.classList.add("selected");
      selectedOption = key;
      console.log("Selected:", selectedOption);
    }
  </script>
</body>
</html>
