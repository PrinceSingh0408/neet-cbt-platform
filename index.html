<!DOCTYPE html>
<html>
<head>
  <title>NEET CBT Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .option {
      padding: 12px;
      margin: 8px 0;
      border: 2px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
    }
    .option.selected {
      border-color: #2563eb;
      background-color: #dbeafe;
    }
    .nav-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:disabled { background: #ccc; }
    #progress { color: #666; }
    #timer { color: #dc2626; font-weight: bold; margin-bottom: 10px; }
    #submitBtn { background: #16a34a; margin-top: 15px; width: 100%; }
    #result { font-size: 18px; line-height: 1.6; }

    #palette {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 25px;
    }
    .palette-btn {
      padding: 10px 0;
      border-radius: 6px;
      border: none;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      background: #e5e7eb;
      color: #333;
    }
    .palette-btn.answered { background: #16a34a; color: white; }
    .palette-btn.current { outline: 3px solid #2563eb; }
  </style>
</head>
<body>
  <div id="timer"></div>
  <div id="progress"></div>
  <h2 id="question">Loading...</h2>
  <div id="options"></div>
  <div class="nav-buttons">
    <button id="prevBtn" onclick="goPrev()">Previous</button>
    <button id="nextBtn" onclick="goNext()">Next</button>
  </div>

  <div id="palette"></div>

  <button id="submitBtn" onclick="submitTest()">Submit Test</button>
  <div id="result"></div>

  <script>
    const SUPABASE_URL = "https://tqjjnogifmhcslbxwnrs.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Eluq0Y73vVI9cFz6yRxzrA_df1IZNNs";

    let questions = [];
    let currentIndex = 0;
    let answers = {};
    let timeLeft = 300;
    let timerInterval;

    fetch(`${SUPABASE_URL}/rest/v1/questions?select=*`, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    })
      .then(res => res.json())
      .then(data => {
        questions = data;
        renderQuestion();
        renderPalette();
        startTimer();
      })
      .catch(err => {
        document.getElementById("question").innerText = "Error loading questions.";
        console.error(err);
      });

    function startTimer() {
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitTest();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const min = Math.floor(timeLeft / 60);
      const sec = timeLeft % 60;
      document.getElementById("timer").innerText = `Time Left: ${min}:${sec.toString().padStart(2, "0")}`;
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      document.getElementById("progress").innerText = `Question ${currentIndex + 1} of ${questions.length}`;
      document.getElementById("question").innerText = q.question_text;

      const options = { A: q.option_a, B: q.option_b, C: q.option_c, D: q.option_d };
      const container = document.getElementById("options");
      container.innerHTML = "";

      Object.entries(options).forEach(([key, text]) => {
        const div = document.createElement("div");
        div.className = "option";
        if (answers[q.id] === key) div.classList.add("selected");
        div.innerText = `${key}. ${text}`;
        div.onclick = () => selectOption(q.id, key, div);
        container.appendChild(div);
      });

      document.getElementById("prevBtn").disabled = currentIndex === 0;
      document.getElementById("nextBtn").disabled = currentIndex === questions.length - 1;

      renderPalette();
    }

    function renderPalette() {
      const container = document.getElementById("palette");
      container.innerHTML = "";
      questions.forEach((q, i) => {
        const btn = document.createElement("button");
        btn.className = "palette-btn";
        if (answers[q.id]) btn.classList.add("answered");
        if (i === currentIndex) btn.classList.add("current");
        btn.innerText = i + 1;
        btn.onclick = () => {
          currentIndex = i;
          renderQuestion();
        };
        container.appendChild(btn);
      });
    }

    function selectOption(questionId, key, element) {
      document.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
      element.classList.add("selected");
      answers[questionId] = key;
      renderPalette();
    }

    function goNext() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    }

    function goPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function submitTest() {
      clearInterval(timerInterval);

      let correct = 0, incorrect = 0, unattempted = 0;

      questions.forEach(q => {
        const given = answers[q.id];
        if (!given) unattempted++;
        else if (given === q.correct_option) correct++;
        else incorrect++;
      });

      const score = (correct * 4) - (incorrect * 1);

      document.getElementById("question").style.display = "none";
      document.getElementById("options").style.display = "none";
      document.querySelector(".nav-buttons").style.display = "none";
      document.getElementById("palette").style.display = "none";
      document.getElementById("submitBtn").style.display = "none";
      document.getElementById("progress").style.display = "none";
      document.getElementById("timer").style.display = "none";

      document.getElementById("result").innerHTML = `
        <h2>Test Submitted</h2>
        <p>Score: ${score} / ${questions.length * 4}</p>
        <p>Correct: ${correct}</p>
        <p>Incorrect: ${incorrect}</p>
        <p>Unattempted: ${unattempted}</p>
      `;
    }
  </script>
</body>
</html>
