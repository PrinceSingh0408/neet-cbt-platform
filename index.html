<!DOCTYPE html>
<html>
<head>
  <title>NEET CBT Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f8fafc; }
    header {
      background: #1e3a8a;
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header .brand { font-weight: bold; font-size: 18px; }
    header .right { display: flex; gap: 8px; align-items: center; }
    header .palette-toggle {
      background: #2563eb;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    header .logout-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.5);
      color: white;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    #meta {
      display: flex;
      justify-content: space-between;
      padding: 10px 16px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }
    #timer { color: #dc2626; font-weight: bold; }
    #progress { color: #555; }
    main { padding: 16px; max-width: 500px; margin: 0 auto; }
    #question { font-size: 20px; margin-top: 10px; }
    .option {
      padding: 14px;
      margin: 10px 0;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      cursor: pointer;
      background: white;
    }
    .option.selected {
      border-color: #2563eb;
      background-color: #dbeafe;
    }
    .nav-buttons {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav-row { display: flex; gap: 8px; }
    button.action {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button.action.secondary { background: #64748b; }
    button.action.review { background: #9333ea; width: 100%; }
    button.action.review.active { background: #6b21a8; box-shadow: inset 0 0 0 3px #ede9fe; }
    button.action:disabled { background: #cbd5e1; }
    #submitBtn { background: #16a34a; margin-top: 15px; width: 100%; padding: 14px; font-size: 16px; }
    #result { font-size: 18px; line-height: 1.8; }

    #paletteOverlay {
      display: none;
      position: fixed;
      top: 0; right: 0;
      width: 240px;
      height: 100%;
      background: white;
      box-shadow: -2px 0 10px rgba(0,0,0,0.2);
      padding: 16px;
      z-index: 10;
      overflow-y: auto;
    }
    #paletteOverlay.open { display: block; }
    #paletteOverlay h3 { margin-top: 0; }
    #paletteGrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .palette-btn {
      padding: 10px 0;
      border-radius: 6px;
      border: none;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      background: #e5e7eb;
      color: #333;
    }
    .palette-btn.answered { background: #16a34a; color: white; }
    .palette-btn.review { background: #9333ea; color: white; }
    .palette-btn.answered.review { background: linear-gradient(135deg, #16a34a 50%, #9333ea 50%); color: white; }
    .palette-btn.current { outline: 3px solid #2563eb; }
    .legend { margin-top: 16px; font-size: 13px; line-height: 1.8; }
    .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
    #closePalette {
      margin-top: 16px;
      width: 100%;
      padding: 10px;
      background: #64748b;
      color: white;
      border: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">🧬 NEET CBT</div>
    <div class="right">
      <button class="palette-toggle" onclick="togglePalette()">📋 <span id="paletteBtnLabel"></span></button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <div id="meta">
    <div id="timer"></div>
    <div id="progress"></div>
  </div>

  <main>
    <h2 id="question">Loading...</h2>
    <div id="options"></div>
    <div class="nav-buttons">
      <button class="action review" id="reviewBtn" onclick="toggleReview()">🚩 Mark for Review</button>
      <div class="nav-row">
        <button class="action secondary" id="prevBtn" onclick="goPrev()">Previous</button>
        <button class="action" id="nextBtn" onclick="goNext()">Next</button>
      </div>
    </div>
    <button id="submitBtn" onclick="submitTest()">Submit Test</button>
    <div id="result"></div>
  </main>

  <div id="paletteOverlay">
    <h3>Question Palette</h3>
    <div id="paletteGrid"></div>
    <div class="legend">
      <div><span style="background:#16a34a"></span>Answered</div>
      <div><span style="background:#9333ea"></span>Marked for Review</div>
      <div><span style="background:#e5e7eb"></span>Not Answered</div>
    </div>
    <button id="closePalette" onclick="togglePalette()">Close</button>
  </div>

  <script>
    const SUPABASE_URL = "https://tqjjnogifmhcslbxwnrs.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Eluq0Y73vVI9cFz6yRxzrA_df1IZNNs";

    // --- Auth check: redirect to login if not authenticated ---
    const accessToken = localStorage.getItem("access_token");
    const userId = localStorage.getItem("user_id");
    if (!accessToken || !userId) {
      window.location.href = "login.html";
    }

    function logout() {
      localStorage.removeItem("access_token");
      localStorage.removeItem("user_id");
      window.location.href = "login.html";
    }

    let questions = [];
    let currentIndex = 0;
    let answers = {};
    let markedForReview = {};
    let timeLeft = 300;
    let timerInterval;

    fetch(`${SUPABASE_URL}/rest/v1/questions?select=*&order=id`, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    })
      .then(res => res.json())
      .then(data => {
        questions = data;
        renderQuestion();
        startTimer();
      })
      .catch(err => {
        document.getElementById("question").innerText = "Error loading questions.";
        console.error(err);
      });

    function startTimer() {
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitTest();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const min = Math.floor(timeLeft / 60);
      const sec = timeLeft % 60;
      document.getElementById("timer").innerText = `⏱ ${min}:${sec.toString().padStart(2, "0")}`;
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      document.getElementById("progress").innerText = `Q ${currentIndex + 1} / ${questions.length}`;
      document.getElementById("paletteBtnLabel").innerText = `${currentIndex + 1}/${questions.length}`;
      document.getElementById("question").innerText = q.question_text;

      const options = { A: q.option_a, B: q.option_b, C: q.option_c, D: q.option_d };
      const container = document.getElementById("options");
      container.innerHTML = "";

      Object.entries(options).forEach(([key, text]) => {
        const div = document.createElement("div");
        div.className = "option";
        if (answers[q.id] === key) div.classList.add("selected");
        div.innerText = `${key}. ${text}`;
        div.onclick = () => selectOption(q.id, key, div);
        container.appendChild(div);
      });

      document.getElementById("prevBtn").disabled = currentIndex === 0;
      document.getElementById("nextBtn").disabled = currentIndex === questions.length - 1;

      const reviewBtn = document.getElementById("reviewBtn");
      if (markedForReview[q.id]) {
        reviewBtn.innerText = "✅ Marked for Review (tap to unmark)";
        reviewBtn.classList.add("active");
      } else {
        reviewBtn.innerText = "🚩 Mark for Review";
        reviewBtn.classList.remove("active");
      }

      renderPalette();
    }

    function renderPalette() {
      const container = document.getElementById("paletteGrid");
      container.innerHTML = "";
      questions.forEach((q, i) => {
        const btn = document.createElement("button");
        btn.className = "palette-btn";
        if (answers[q.id]) btn.classList.add("answered");
        if (markedForReview[q.id]) btn.classList.add("review");
        if (i === currentIndex) btn.classList.add("current");
        btn.innerText = i + 1;
        btn.onclick = () => {
          currentIndex = i;
          renderQuestion();
          togglePalette();
        };
        container.appendChild(btn);
      });
    }

    function togglePalette() {
      document.getElementById("paletteOverlay").classList.toggle("open");
    }

    function selectOption(questionId, key, element) {
      document.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
      element.classList.add("selected");
      answers[questionId] = key;
      renderPalette();
    }

    function toggleReview() {
      const q = questions[currentIndex];
      markedForReview[q.id] = !markedForReview[q.id];
      renderQuestion();
    }

    function goNext() {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    }

    function goPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function submitTest() {
      clearInterval(timerInterval);
      document.getElementById("meta").style.display = "none";
      document.querySelector("header .palette-toggle").style.display = "none";
      let correct = 0, incorrect = 0, unattempted = 0;

      questions.forEach(q => {
        const given = answers[q.id];
        if (!given) unattempted++;
        else if (given === q.correct_option) correct++;
        else incorrect++;
      });

      const score = (correct * 4) - (incorrect * 1);

      document.querySelector("main").innerHTML = `<div id="result"><p>Saving your result...</p></div>`;

      fetch(`${SUPABASE_URL}/rest/v1/attempts`, {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${accessToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          score: score,
          correct: correct,
          incorrect: incorrect,
          unattempted: unattempted,
          total_questions: questions.length,
          user_id: userId
        })
      })
        .then(() => {
          document.getElementById("result").innerHTML = `
            <h2>Test Submitted</h2>
            <p>Score: ${score} / ${questions.length * 4}</p>
            <p>Correct: ${correct}</p>
            <p>Incorrect: ${incorrect}</p>
            <p>Unattempted: ${unattempted}</p>
            <p style="color:#16a34a; font-size:14px;">✅ Result saved</p>
          `;
        })
        .catch(err => {
          console.error(err);
          document.getElementById("result").innerHTML = `
            <h2>Test Submitted</h2>
            <p>Score: ${score} / ${questions.length * 4}</p>
            <p>Correct: ${correct}</p>
            <p>Incorrect: ${incorrect}</p>
            <p>Unattempted: ${unattempted}</p>
            <p style="color:#dc2626; font-size:14px;">⚠️ Couldn't save result — check connection</p>
          `;
        });
    }
  </script>
</body>
  </html>
