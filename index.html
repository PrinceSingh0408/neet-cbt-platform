<!DOCTYPE html>
<html>
<head>
  <title>NEET CBT Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2 id="question">Loading...</h2>
  <div id="options"></div>

  <script>
    const SUPABASE_URL = "https://tqjjnogifmhcslbxwnrs.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Eluq0Y73vVI9cFz6yRxzrA_df1IZNNs";

    fetch(`${SUPABASE_URL}/rest/v1/questions?select=*&limit=1`, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    })
      .then(res => res.json())
      .then(data => {
        const q = data[0];
        document.getElementById("question").innerText = q.question_text;
        document.getElementById("options").innerHTML = `
          <p>A. ${q.option_a}</p>
          <p>B. ${q.option_b}</p>
          <p>C. ${q.option_c}</p>
          <p>D. ${q.option_d}</p>
        `;
      })
      .catch(err => {
        document.getElementById("question").innerText = "Error loading question.";
        console.error(err);
      });
  </script>
</body>
</html>
