<!DOCTYPE html>
<html>
<head>
  <title>NEET CBT Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f8fafc; }
    header {
      background: #1e3a8a;
      color: white;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header .brand { font-weight: bold; font-size: 18px; }
    header .palette-toggle {
      background: #2563eb;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    #meta {
      display: flex;
      justify-content: space-between;
      padding: 10px 16px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }
    #timer { color: #dc2626; font-weight: bold; }
    #progress { color: #555; }
    main { padding: 16px; max-width: 500px; margin: 0 auto; }
    #question { font-size: 20px; margin-top: 10px; }
    .option {
      padding: 14px;
      margin: 10px 0;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      cursor: pointer;
      background: white;
    }
    .option.selected {
      border-color: #2563eb;
      background-color: #dbeafe;
    }
    .nav-buttons {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    button.action {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button.action.secondary { background: #64748b; }
    button.action:disabled { background: #cbd5e1; }
    #submitBtn { background: #16a34a; margin-top: 15px; width: 100%; padding: 14px; font-size: 16px; }
    #result { font-size: 18px; line-height: 1.8; }

    #paletteOverlay {
      display: none;
      position: fixed;
      top: 0; right: 0;
      width: 240px;
      height: 100%;
      background: white;
      box-shadow: -2px 0 10px rgba(0,0,0,0.2);
      padding: 16px;
      z-index: 10;
    }
    #paletteOverlay.open { display: block; }
    #paletteOverlay h3 { margin-top: 0; }
    #paletteGrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .palette-btn {
      padding: 10px 0;
      border-radius: 6px;
      border: none;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      background: #e5e7eb;
      color: #333;
    }
    .palette-btn.answered { background: #16a34a; color: white; }
    .palette-btn.current { outline: 3px solid #2563eb; }
    #closePalette {
      margin-top: 16px;
      width: 100%;
      padding: 10px;
      background: #64748b;
      color: white;
      border: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">🧬 NEET CBT</div>
    <button class="palette-toggle" onclick="togglePalette()">📋 <span id="paletteBtnLabel"></span></button>
  </header>

  <div id="meta">
    <div id="timer"></div>
    <div id="progress"></div>
  </div>

  <main>
    <h2 id="question">Loading...</h2>
    <div id="options"></div>
    <div class="nav-buttons">
      <button class="action secondary" id="prevBtn" onclick="goPrev()">Previous</button>
      <button class="action secondary" onclick="skipQuestion()">Skip</button>
      <button class="action" id="nextBtn" onclick="goNext()">Next</button>
    </div>
    <button id="submitBtn" onclick="submitTest()">Submit Test</button>
    <div id="result"></div>
  </main>

  <div id="paletteOverlay">
    <h3>Question Palette</h3>
    <div id="paletteGrid"></div>
    <button id="closePalette" onclick="togglePalette()">Close</button>
  </div>

  <script>
    const SUPABASE_URL = "https://tqjjnogifmhcslbxwnrs.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Eluq0Y73vVI9cFz6yRxzrA_df1IZNNs";

    let questions = [];
    let currentIndex = 0;
    let answers = {}; // keyed by id
    let timeLeft = 300;
    let timerInterval;

    fetch(`${SUPABASE_URL}/rest/v1/questions?select=*&order=id`, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    })
      .then(res => res.json())
      .then(data => {
        questions = data;
        renderQuestion();
        startTimer();
      })
      .catch(err => {
        document.getElementById("question").innerText = "Error loading questions.";
        console.error(err);
      });

    function startTimer() {
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          submitTest();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const min = Math.floor(timeLeft / 60);
      const sec = timeLeft % 60;
      document.getElementById("timer").innerText = `⏱ ${min}:${sec.toString().padStart(2, "0")}`;
    }
