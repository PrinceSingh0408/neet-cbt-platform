<!DOCTYPE html>
<html>
<head>
  <title>Login - NEET CBT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #1e3a8a 0%, #2563eb 45%, #f8fafc 45%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .brand {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }
    .brand .icon { font-size: 40px; }
    .brand h1 { margin: 8px 0 4px; font-size: 24px; }
    .brand p { margin: 0; font-size: 13px; opacity: 0.85; }
    .card {
      width: 100%;
      max-width: 380px;
      background: white;
      padding: 28px 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .card h2 { margin: 0 0 4px; font-size: 18px; color: #1e293b; }
    .card p.sub { margin: 0 0 18px; font-size: 13px; color: #64748b; }
    label { font-size: 13px; font-weight: bold; color: #334155; display: block; margin-top: 12px; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.15s;
    }
    input:focus { outline: none; border-color: #2563eb; }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.85; }
    #loginBtn { background: #2563eb; color: white; }
    #signupBtn { background: white; color: #16a34a; border: 2px solid #16a34a; margin-top: 10px; }
    #message { text-align: center; margin-top: 14px; font-size: 13px; min-height: 18px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="icon">🧬</div>
    <h1>NEET CBT</h1>
    <p>Practice like it's exam day</p>
  </div>

  <div class="card">
    <h2>Welcome</h2>
    <p class="sub">Log in or create an account to start practicing</p>

    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label>Password</label>
    <input type="password" id="password" placeholder="Min 6 characters">

    <button id="loginBtn" onclick="login()">Log In</button>
    <button id="signupBtn" onclick="signup()">Create New Account</button>
    <div id="message"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://tqjjnogifmhcslbxwnrs.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Eluq0Y73vVI9cFz6yRxzrA_df1IZNNs";

    function showMessage(text, isError) {
      const el = document.getElementById("message");
      el.innerText = text;
      el.style.color = isError ? "#dc2626" : "#16a34a";
    }

    function signup() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      fetch(`${SUPABASE_URL}/auth/v1/signup`, {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      })
        .then(res => res.json())
        .then(data => {
          if (data.id || data.user) {
            showMessage("Account created! Now tap Log In.", false);
          } else {
            showMessage(data.msg || data.error_description || "Signup failed", true);
          }
        })
        .catch(err => showMessage("Network error", true));
    }

    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: "POST",
        headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      })
        .then(res => res.json())
        .then(data => {
          if (data.access_token) {
            localStorage.setItem("access_token", data.access_token);
            localStorage.setItem("user_id", data.user.id);
            showMessage("Logged in! Redirecting...", false);
            setTimeout(() => { window.location.href = "home.html"; }, 800);
          } else {
            showMessage(data.msg || data.error_description || "Login failed", true);
          }
        })
        .catch(err => showMessage("Network error", true));
    }
  </script>
</body>
</html>
